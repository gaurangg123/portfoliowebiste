<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" class="motif motif--neural" viewBox="0 0 400 220" role="img"><title>neural motif</title>
  <style>
    svg{--tone:#8B5CF6;background:#0A1020}
    *{fill:none;stroke:#94A3B8;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
